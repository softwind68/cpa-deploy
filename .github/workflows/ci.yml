name: Offline Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          bash --version
          python3 --version
          node --version
          jq --version
      - name: Bash syntax
        run: |
          bash -n cpa-deploy.sh
          bash -n tests/smoke.sh
      - name: Privacy and secret patterns
        run: python3 -B tools/scan_release.py
      - name: Python and embedded frontend regressions
        run: python3 -B -m unittest discover -s tests -v
      - name: Shell regressions
        run: bash tests/smoke.sh
